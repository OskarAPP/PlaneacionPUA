services:
  # Servicio de Frontend (Nginx + React Static)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
    networks:
      - app-network

  # Servicio de Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www
    environment:
      # Configuraciones de Laravel para producción en Docker
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

      # Base de datos
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-pua_db}
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}

      # Cache y Sesiones
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Redis Config
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379

    depends_on:
      - db
      - redis
    networks:
      - app-network
    volumes:
      - ./backend:/var/www
      # Opcional: Persistir storage si se suben archivos
      # - backend_storage:/var/www/storage

      # Servicio de Base de Datos (MySQL/MariaDB)
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pua_db}
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/mysql
      # Inicializar DB con el script sql si existe
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - app-network

  # Servicio de Redis (para Cache y Colas)
  redis:
    image: redis:alpine
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  backend_storage:
